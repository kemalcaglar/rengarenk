name: Deploy
# Etiketli sürüm (v0.1.0 gibi) gönderilince imajlar derlenir ve canlı sunucuya alınır.
on:
  push: { tags: ["v*"] }
  workflow_dispatch:

permissions: { contents: read, packages: write }

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, file: apps/api/Dockerfile, target: runtime, app: "" }
          - { name: migrate, file: apps/api/Dockerfile, target: migrate, app: "" }
          - { name: web, file: apps/web/Dockerfile, target: runtime, app: web }
          - { name: admin, file: apps/web/Dockerfile, target: runtime, app: admin }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          # Web ve konsolun tarayıcı kodu API adresini derlemede alır (Next.js NEXT_PUBLIC_*).
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'https://api.rengarenksite.com' }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ vars.META_PIXEL_ID }}
            NEXT_PUBLIC_GOOGLE_TAG_ID=${{ vars.GOOGLE_TAG_ID }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rengarenk-${{ matrix.name }}:${{ github.ref_name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Sunucuda güncelle
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ github.ref_name }}
        run: |
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd /srv/rengarenk && export TAG=$TAG && docker compose -f compose.prod.yml pull && \
             docker compose -f compose.prod.yml run --rm migrate && docker compose -f compose.prod.yml up -d"
