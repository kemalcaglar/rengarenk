# Yerel geliştirme altyapısı. Uygulamalar `pnpm dev` ile makinede çalışır.
name: rengarenk
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rengarenk
      POSTGRES_PASSWORD: rengarenk
      POSTGRES_DB: rengarenk
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rengarenk"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
  opensearch:
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: rengarenk
      MINIO_ROOT_PASSWORD: rengarenk-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata: {}
  osdata: {}
  miniodata: {}
