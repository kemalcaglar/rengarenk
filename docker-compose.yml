# Yerel geliştirme altyapısı. Uygulamalar `pnpm dev` ile makinede çalışır.
name: rengarenk
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rengarenk
      POSTGRES_PASSWORD: rengarenk
      POSTGRES_DB: rengarenk
    # Bilgisayarda kurulu bir PostgreSQL 5432'yi kullanıyor olabilir; çakışmasın diye 5433.
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/dev/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rengarenk"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
  opensearch:
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
  # S3 uyumlu dosya deposu. MinIO topluluk sürümü Ekim 2025'ten beri Docker imajı yayınlamıyor
  # ve Nisan 2026'da arşivlendi; yerine SeaweedFS (Apache-2.0). Yerelde kimlik doğrulama kapalı.
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024
    ports: ["8333:8333", "9333:9333"]
    volumes: [s3data:/data]
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata: {}
  osdata: {}
  s3data: {}
