# Canlı provası: compose.prod.yml'i bu bilgisayarda, canlı kipinde (NODE_ENV=production) ayağa kaldırır.
# Sunucular gelmeden imajların, göçlerin ve yapılandırmanın çalıştığını görmek içindir. Ayrıntı: README › Canlı provası.
#
#   docker compose -f deploy/compose.prod.yml -f deploy/prova/compose.prova.yml up -d
#
# Geliştirme ortamıyla karışmaması için proje adı ayrıdır; hiçbir port geliştirme portlarıyla çakışmaz.
name: rengarenk-prova

x-prova-env: &prova-env
  env_file: !override [prova/prova.env]

services:
  # PostgreSQL canlıdaki tanımdan gelir; provada uydurma parola ve ayrı birim.
  postgres:
    environment: { POSTGRES_PASSWORD: prova }
    volumes: !override [prova_pg:/var/lib/postgresql/data]

  caddy:
    ports: !override ["18080:18080", "14000:14000", "13001:13001"]
    volumes: !override
      - ./prova/Caddyfile.prova:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  api:
    <<: *prova-env
  worker:
    <<: *prova-env
  web:
    <<: *prova-env
  admin:
    <<: *prova-env
  migrate:
    <<: *prova-env

  opensearch:
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m

  seaweedfs:
    volumes: !override
      - s3_data:/data
      - ./prova/seaweedfs.s3.prova.json:/etc/seaweedfs/s3.json:ro

volumes:
  prova_pg: {}
