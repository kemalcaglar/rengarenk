# Canlı provası: compose.prod.yml'i bu bilgisayarda, canlı kipinde (NODE_ENV=production) ayağa kaldırır.
# Sunucular gelmeden imajların, göçlerin ve yapılandırmanın çalıştığını görmek içindir. Ayrıntı: README › Canlı provası.
#
#   docker compose -f deploy/compose.prod.yml -f deploy/prova/compose.prova.yml up -d
#
# Geliştirme ortamıyla karışmaması için proje adı ayrıdır; hiçbir port geliştirme portlarıyla çakışmaz.
name: rengarenk-prova

x-prova-env: &prova-env
  env_file: !override [prova/prova.env]

services:
  # Canlıda PostgreSQL ayrı sunucudadır; provada yanına bir tane kurulur.
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: rengarenk, POSTGRES_PASSWORD: prova, POSTGRES_DB: rengarenk }
    volumes: [prova_pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rengarenk"], interval: 3s, retries: 20 }

  caddy:
    ports: !override ["18080:18080", "14000:14000", "13001:13001"]
    volumes: !override
      - ./prova/Caddyfile.prova:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  api:
    <<: *prova-env
    depends_on: { postgres: { condition: service_healthy } }
  worker:
    <<: *prova-env
    depends_on: { postgres: { condition: service_healthy } }
  web:
    <<: *prova-env
  admin:
    <<: *prova-env
  migrate:
    <<: *prova-env
    depends_on: { postgres: { condition: service_healthy } }

  opensearch:
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m

  seaweedfs:
    volumes: !override
      - s3_data:/data
      - ./seaweedfs.s3.example.json:/etc/seaweedfs/s3.json:ro

volumes:
  prova_pg: {}
